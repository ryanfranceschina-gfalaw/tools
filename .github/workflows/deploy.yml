name: Build and publish website

# Runs on every change to the site source, every night (to refresh Etsy merch),
# and on demand. To publish a batch of edits, upload site-src.zip to the
# repository root; this workflow unpacks it, commits it and republishes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # nightly, about 3:17 a.m. Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack an uploaded site-src.zip
        run: |
          if [ -f site-src.zip ]; then
            unzip -o -q site-src.zip -d .
            if [ -f scripts/legacy-cleanup.txt ]; then
              while read -r p; do [ -n "$p" ] && git rm -r -q --ignore-unmatch "$p"; done < scripts/legacy-cleanup.txt
              rm -f scripts/legacy-cleanup.txt
            fi
            git rm -q --cached site-src.zip || true
            rm -f site-src.zip
          fi
      - name: Refresh merch from Etsy
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: python3 scripts/refresh_merch.py
      - name: Save source changes
        run: |
          git config user.name "GFA LAW website bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "Website source update (automatic)"; git push; }
      - name: Build the site
        run: python3 build.py
      - name: Check internal links
        run: python3 scripts/check_links.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
