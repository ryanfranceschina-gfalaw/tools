name: Unpack website upload

# Upload site.zip to the repository root (Add file > Upload files).
# This workflow unpacks it over the existing files, removes the zip
# and commits the result, which republishes the website.
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site.zip
        run: |
          test -f site.zip || { echo "No site.zip found"; exit 0; }
          unzip -o -q site.zip -d .
          git rm -q --cached site.zip || true
          rm -f site.zip
          git config user.name "GFA LAW website bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site.zip" || echo "Nothing to commit"
          git push
