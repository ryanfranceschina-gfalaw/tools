name: Weekly website health check

# Every Monday: loads every page in the live sitemap plus the intake forms,
# checks every outside link on the site, and records page-speed and
# accessibility scores. A failure here emails the repository owner.
on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check every page and form
        run: |
          fail=0
          urls=$(curl -sL --max-time 30 https://www.gfalaw.us/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//')
          urls="$urls
          https://gfa-law-pllc.mycase.com/contact_us/tV99Frbor6aVhkfXGLK2Abhc
          https://gfa-law-pllc.mycase.com/contact_us/KRA1LYw2Dno1vnJTEp49mCft
          https://gfa-law-pllc.mycase.com/contact_us/NTqsGH4GHoUzNbjDfTpv8t1T
          https://www.gfalaw.us/study-portal/
          https://www.gfalaw.us/deadline-checker.html"
          n=0
          for u in $urls; do
            n=$((n+1))
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 -A 'Mozilla/5.0 (GFA LAW site check)' "$u")
            if [ "$code" = "200" ]; then echo "OK   $code $u"; else echo "::error::$code $u"; fail=1; fi
          done
          echo "Checked $n addresses"
          [ "$n" -gt 25 ] || { echo "::error::Sitemap looked empty"; fail=1; }
          exit $fail

  outside-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: Check outside links (news articles, Etsy, MyCase, LawPay)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 30 --max-retries 2
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999
            --exclude-path _site/study-portal --exclude-path _site/embeds
            --exclude 'fonts\.(googleapis|gstatic)\.com' --exclude 'googletagmanager' --exclude 'x\.com/intent' --exclude 'facebook\.com/sharer'
            '_site/**/*.html'
          fail: true

  speed-and-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Page speed, accessibility and SEO scores
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://www.gfalaw.us/
            https://www.gfalaw.us/contact/contact-gfa-law/
            https://www.gfalaw.us/about-the-firm/practice-areas/innocent-defense/
            https://www.gfalaw.us/press-releases/
            https://www.gfalaw.us/merch/
          uploadArtifacts: true
          temporaryPublicStorage: true
